apiVersion: v1
kind: Service
metadata:
  name: service-{{ .Release.Name }}
  labels:
    {{- include "3-tier-backend-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "3-tier-backend-chart.selectorLabels" . | nindent 4 }}
